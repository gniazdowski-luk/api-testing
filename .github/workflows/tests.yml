name: tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (qa | staging)'
        type: choice
        options:
          - qa
          - staging
        default: qa
      run_functional:
        description: Run functional tests
        type: boolean
        default: false
      run_security:
        description: Run security tests
        type: boolean
        default: false
      run_performance:
        description: Run performance tests
        type: boolean
        default: false
  pull_request:
    branches:
      - main

env:
  AUTHENTICATION_ID: ${{ secrets.AUTHENTICATION_ID }}
  AUTHENTICATION_EMAIL: ${{ secrets.AUTHENTICATION_EMAIL }}
  AUTHENTICATION_PASSWORD: ${{ secrets.AUTHENTICATION_PASSWORD }}
  TEST_ENV: ${{ inputs.environment || 'qa' }}

jobs:
  requirements-traceability:
    name: Requirements Traceability Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate requirements and tests coverage
        run: npm run check:requirements-traceability

  detect-changes:
    name: Detect changed tests
    needs: [requirements-traceability]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      test_files: ${{ steps.changed.outputs.test_files }}
      has_tests: ${{ steps.changed.outputs.has_tests }}
      functional_files: ${{ steps.changed.outputs.functional_files }}
      has_functional: ${{ steps.changed.outputs.has_functional }}
      security_files: ${{ steps.changed.outputs.security_files }}
      has_security: ${{ steps.changed.outputs.has_security }}
      performance_files: ${{ steps.changed.outputs.performance_files }}
      has_performance: ${{ steps.changed.outputs.has_performance }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find changed test files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'tests/**/*.spec.ts' | tr '\n' ' ')
          echo "test_files=$FILES" >> $GITHUB_OUTPUT
          if [ -n "$FILES" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

          FUNCTIONAL=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'tests/2_functional/**/*.spec.ts' | tr '\n' ' ')
          echo "functional_files=$FUNCTIONAL" >> $GITHUB_OUTPUT
          if [ -n "$FUNCTIONAL" ]; then
            echo "has_functional=true" >> $GITHUB_OUTPUT
          else
            echo "has_functional=false" >> $GITHUB_OUTPUT
          fi

          SECURITY=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'tests/3_security/**/*.spec.ts' | tr '\n' ' ')
          echo "security_files=$SECURITY" >> $GITHUB_OUTPUT
          if [ -n "$SECURITY" ]; then
            echo "has_security=true" >> $GITHUB_OUTPUT
          else
            echo "has_security=false" >> $GITHUB_OUTPUT
          fi

          PERFORMANCE=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'tests/4_performance/**/*.spec.ts' | tr '\n' ' ')
          echo "performance_files=$PERFORMANCE" >> $GITHUB_OUTPUT
          if [ -n "$PERFORMANCE" ]; then
            echo "has_performance=true" >> $GITHUB_OUTPUT
          else
            echo "has_performance=false" >> $GITHUB_OUTPUT
          fi

          echo "::group::Detected changed test files"
          echo "Functional:      ${FUNCTIONAL:-<none>}"
          echo "Security:        ${SECURITY:-<none>}"
          echo "Performance:     ${PERFORMANCE:-<none>}"
          echo "::endgroup::"

  quality:
    name: Quality Check
    needs: [requirements-traceability]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Biome check
        run: npm run biome:check

  pr-functional:
    name: PR Functional Tests
    needs: [quality, detect-changes, contract]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.has_functional == 'true'
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run changed functional tests
        run: npx playwright test ${{ needs.detect-changes.outputs.functional_files }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-pr-functional
          path: playwright-report/
          retention-days: 7

  pr-security:
    name: PR Security Tests
    needs: [quality, detect-changes, contract, pr-functional]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.has_security == 'true' &&
      (needs.pr-functional.result == 'success' || needs.pr-functional.result == 'skipped')
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run changed security tests
        run: npx playwright test ${{ needs.detect-changes.outputs.security_files }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-pr-security
          path: playwright-report/
          retention-days: 7

  pr-performance:
    name: PR Performance Tests
    needs: [quality, detect-changes, contract, pr-functional, pr-security]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.has_performance == 'true' &&
      (needs.pr-functional.result == 'success' || needs.pr-functional.result == 'skipped') &&
      (needs.pr-security.result == 'success' || needs.pr-security.result == 'skipped')
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run changed performance tests
        run: npx playwright test ${{ needs.detect-changes.outputs.performance_files }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-pr-performance
          path: playwright-report/
          retention-days: 7

  smoke:
    name: Smoke Tests
    needs: [requirements-traceability, quality]
    if: always() && (needs.requirements-traceability.result == 'success' || needs.requirements-traceability.result == 'skipped') && (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        if: ${{ inputs.environment == 'qa' }}
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npx playwright test --project=setup-authentication --project=tests-smoke --reporter=blob,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-smoke
          path: blob-report/
          retention-days: 1

  contract:
    name: Contract Tests
    needs: [smoke]
    if: always() && needs.smoke.result == 'success'
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        if: ${{ inputs.environment == 'qa' }}
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npx playwright test --project=setup-authentication --project=tests-contract --reporter=blob,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-contract
          path: playwright-report/
          retention-days: 7

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-contract
          path: blob-report/
          retention-days: 1

  functional:
    name: Functional Tests
    needs: [smoke, contract]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.run_functional == true && needs.smoke.result == 'success' && needs.contract.result == 'success'
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        if: ${{ inputs.environment == 'qa' }}
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run functional tests
        run: npx playwright test --project=setup-authentication --project=tests-functional --reporter=blob,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-functional
          path: playwright-report/
          retention-days: 7

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-functional
          path: blob-report/
          retention-days: 1

  security:
    name: Security Tests
    needs: [smoke, functional]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.run_security == true && needs.smoke.result == 'success'
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        if: ${{ inputs.environment == 'qa' }}
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npx playwright test --project=setup-authentication --project=tests-security --reporter=blob,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-security
          path: playwright-report/
          retention-days: 7

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-security
          path: blob-report/
          retention-days: 1

  performance:
    name: Performance Tests
    needs: [smoke, functional, security]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.run_performance == true && needs.smoke.result == 'success'
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        if: ${{ inputs.environment == 'qa' }}
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: npx playwright test --project=setup-authentication --project=tests-performance --reporter=blob,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-performance
          path: playwright-report/
          retention-days: 7

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-performance
          path: blob-report/
          retention-days: 1

  pr-gate:
    name: PR Gate
    needs: [requirements-traceability, quality, smoke, contract, pr-functional, pr-security, pr-performance]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs
        run: |
          results=(
            "requirements-traceability=${{ needs.requirements-traceability.result }}"
            "quality=${{ needs.quality.result }}"
            "smoke=${{ needs.smoke.result }}"
            "contract=${{ needs.contract.result }}"
            "pr-functional=${{ needs.pr-functional.result }}"
            "pr-security=${{ needs.pr-security.result }}"
            "pr-performance=${{ needs.pr-performance.result }}"
          )
          failed=false
          for entry in "${results[@]}"; do
            job="${entry%%=*}"
            result="${entry##*=}"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::Job '$job' did not pass (result: $result)"
              failed=true
            fi
          done
          if [[ "$failed" == "true" ]]; then
            exit 1
          fi
          echo "All required jobs passed or were skipped."

  publish-report:
    name: Publish Report to GitHub Pages
    needs: [smoke, contract, functional, security, performance]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blobs
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./all-blobs

      - name: Deploy report history to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: playwright-report
          destination_dir: reports/run-${{ github.run_number }}-${{ github.run_attempt }}
          keep_files: true
          force_orphan: false
