name: tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (qa | staging)'
        type: choice
        options:
          - qa
          - staging
        default: qa
      run_functional:
        description: Run functional tests
        type: boolean
        default: false
      run_security:
        description: Run security tests
        type: boolean
        default: false
      run_performance:
        description: Run performance tests
        type: boolean
        default: false
  pull_request:
    branches:
      - main

env:
  AUTHENTICATION_ID: ${{ secrets.AUTHENTICATION_ID }}
  AUTHENTICATION_EMAIL: ${{ secrets.AUTHENTICATION_EMAIL }}
  AUTHENTICATION_PASSWORD: ${{ secrets.AUTHENTICATION_PASSWORD }}
  TEST_ENV: ${{ inputs.environment || 'qa' }}

jobs:
  detect-changes:
    name: Detect Changed Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      test_files: ${{ steps.changed.outputs.test_files }}
      has_tests: ${{ steps.changed.outputs.has_tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find changed test files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'tests/**/*.spec.ts' | tr '\n' ' ')
          echo "test_files=$FILES" >> $GITHUB_OUTPUT
          if [ -n "$FILES" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

  quality:
    name: Quality Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Biome check
        run: npm run biome:check

  pr-tests:
    name: PR Changed Tests
    needs: [quality, detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.has_tests == 'true'
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run changed tests
        run: npx playwright test ${{ needs.detect-changes.outputs.test_files }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-pr
          path: playwright-report/
          retention-days: 7

  smoke:
    name: Smoke Tests
    needs: quality
    if: always() && (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        if: ${{ inputs.environment == 'qa' }}
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npx playwright test --project=setup-authentication --project=tests-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  contract:
    name: Contract Tests
    needs: [smoke]
    if: always() && needs.smoke.result == 'success'
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        if: ${{ inputs.environment == 'qa' }}
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npx playwright test --project=setup-authentication --project=tests-contract

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-contract
          path: playwright-report/
          retention-days: 7

  functional:
    name: Functional Tests
    needs: [smoke, contract]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.run_functional == true && needs.smoke.result == 'success' && needs.contract.result == 'success'
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        if: ${{ inputs.environment == 'qa' }}
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run functional tests
        run: npx playwright test --project=setup-authentication --project=tests-functional

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-functional
          path: playwright-report/
          retention-days: 7

  security:
    name: Security Tests
    needs: [smoke, functional]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.run_security == true && needs.smoke.result == 'success'
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        if: ${{ inputs.environment == 'qa' }}
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npx playwright test --project=setup-authentication --project=tests-security

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-security
          path: playwright-report/
          retention-days: 7

  performance:
    name: Performance Tests
    needs: [smoke, functional, security]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.run_performance == true && needs.smoke.result == 'success'
    runs-on: ubuntu-latest

    services:
      gad:
        image: jaktestowac/gad
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for GAD backend
        if: ${{ inputs.environment == 'qa' }}
        uses: ./.github/actions/wait-for-gad

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: npx playwright test --project=setup-authentication --project=tests-performance

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-performance
          path: playwright-report/
          retention-days: 7
